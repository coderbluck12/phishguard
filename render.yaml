services:
  - type: web
    name: phishguard-ai
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m backend.visual_intel.golden_gallery && python -m backend.visual_intel.golden_gallery_extended"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
